project_id = "linky"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/auth/verify", "http://127.0.0.1:3000/auth/verify"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100
token_refresh = 150
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600
[auth.email.template.magic_link]
subject = "Your Linky sign-in code"
content_path = "./supabase/templates/otp.html"
[auth.email.template.confirmation]
subject = "Your Linky sign-in code"
content_path = "./supabase/templates/otp.html"
[edge_runtime]
enabled = false
[analytics]
enabled = false
