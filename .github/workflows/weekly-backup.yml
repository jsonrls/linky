name: Weekly encrypted backup

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for name in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SECRET_KEY BACKUP_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if (( ${#BACKUP_PASSPHRASE} < 32 )) || [[ "$BACKUP_PASSPHRASE" == *$'\n'* || "$BACKUP_PASSPHRASE" == *$'\r'* ]]; then
            echo '::error::BACKUP_PASSPHRASE must have at least 32 characters and no line breaks.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test backup helpers
        run: node --test tests/backup.test.mjs
      - name: Export and encrypt complete backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linky-backup-output/backup.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove backup working files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/linky-backup-work" "$RUNNER_TEMP/linky-backup-output"
