name: Milestone one
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run db:start
      - run: npm run local:env
      - run: npm run db:test
      - run: npx supabase db lint --local --schema public,private --fail-on warning
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start production app
        run: |
          npm start > /tmp/linky-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linky-next.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop
        if: always()
